variables:
  unattended: true
  # Disk Configuration
  disks:
    - "/dev/sda"
    - "/dev/sdb"

  # User and Security
  userName: "skea999"
  password: "CHANGEME"
  luksPassword: "CHANGEME"

  # System Identity
  hostname: "skea-server"
  timezone: "Europe/Rome"
  locale: "it"
  keymap: "it"

  # Repository and Architecture
  mirror: "https://dl-cdn.alpinelinux.org/alpine"
  arch: "x86_64"
  branch: "latest-stable"

  # Layout
  diskLayout: "btrfsStandard" # Options defined in internal_rules
  desktopEnvironment: "none"        # Options: none, kde, niri, cosmic
  videoDriver: "none"               # Options: none, amdgpu, nvidia, intel

  # SSH (optional)
  sshAuthorizedKey: ""

  # Network
  defaultNetworkInterface: "eth0"

  # Feature Toggles
  enableSecureboot: false
  enableTPM: false
  enableHardening: false
  enableZswap: false
  enableNix: false
  enableSwap: true
  swapSize: auto # auto = 2x RAM, or explicit like 8G / 4096M
  enableDebug: false
  enablePodman: false
  enableWebmin: false
  webminListenAll: false  # false = localhost only, true = all interfaces

  # Extra Packages
  # Adding these will trigger dynamic rules (groups, services, etc.)
  extraPackages:
    - incus-feature
    - incus-feature-vm
    - incus-feature-client
    - incus-feature-utils
    - qemu-system-x86_64
    - qemu-img
    - qemu-modules