variables:
  unattended: false
  ignoreErrors: false               # true = log errors and continue (harness mode); false = abort on first error
  # Disk Configuration
  disks:
    - "/dev/sda"

  # User and Security
  userName: "skea999"
  password: "CHANGEME"
  luksPassword: "CHANGEME"

  # System Identity
  hostname: "feralos"
  timezone: "Europe/Rome"
  locale: "it"
  keymap: "it"

  # Repository and Architecture
  mirror: "https://dl-cdn.alpinelinux.org/alpine"
  arch: "x86_64"                    # x86_64 only (FeralOS custom repo is x86_64)
  branch: "latest-stable"           # Options: latest-stable, edge, 3.22

  # Layout
  diskLayout: "btrfsStandard"       # Options: btrfsStandardServer, btrfsStandard, btrfsRaid0, btrfsUnencrypted
  desktopEnvironment: "niri"        # Options: none, kde, niri, cosmic
  videoDriver: "virtio"               # Options: none, amdgpu, nvidia, intel, virtio (QEMU)

  # SSH (optional)
  sshAuthorizedKey: ""

  # Network
  defaultNetworkInterface: "eth0"

  # Feature Toggles
  enableSecureboot: false
  enableTPM: false
  enableHardening: false
  enableZswap: true
  enableNix: true
  enableSwap: true
  swapSize: auto # auto = 2x RAM, or explicit like 8G / 4096M
  enableDebug: false
  enablePodman: true
  enableWebmin: false
  webminListenAll: false            # true = listen on all interfaces, false = localhost only
  enableDinit: true                 # true = dinit init system, false = OpenRC

  # Extra Packages
  # Adding these will trigger dynamic rules (groups, services, etc.)
  extraPackages:
    - okular