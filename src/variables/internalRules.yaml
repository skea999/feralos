chrootDir: "/mnt"

# Default system runlevels — only base OS services
# NOTE: 'modules' service not needed with booster (loads /etc/modules automatically)
# NOTE: udev services are in packageLogic under eudev (Alpine uses mdev by default)
defaultRunlevels:
  sysinit: ["devfs", "dmesg", "sysctl", "sysfs"]
  boot: ["hwclock", "hostname", "bootmisc", "binfmt", "fsck", "root", "procfs", "loadkmap", "localmount"]
  default: ["swap", "cgroups", "networking"]
  shutdown: ["mount-ro", "killprocs", "savecache"]

# Fixed system packages — matches reference skeaSimpleServer exactly
standardPackages:
  # Core
  - sudo-rs
  - musl-locales
  - lang
  - tzdata
  - kbd-bkeymaps
  - font-terminus
  # Secure Boot / UKI
  - efi-mkkeys
  - efitools
  - openssl
  - ca-certificates
  - secureboot-hook
  - systemd-efistub
  - efibootmgr
  # Filesystem / Crypto
  - linux-lts
  - btrfs-progs
  - cryptsetup
  - zstd
  # Services
  - cronie
  - chrony
  - dbus
  - shadow
  - eudev
  - udev-init-scripts
  - openssh
  - mount
  - sed
  - blkid
  - grep
  # Containers / Virtualization
  - qemu-img
  - qemu-system-x86_64
  - qemu-modules
  - incus-feature
  - incus-feature-vm
  - incus-feature-client
  - incus-feature-utils
  # Network
  - bridge
  - bridge-utils
  - vlan
  # Hardware
  - pciutils
  - usbutils
  - cpufrequtils
  - smartmontools
  # Logging
  - vector
  - vector-openrc
  # Shell
  - fish
  - fish-tools
  # Initramfs (booster replaces mkinitfs)
  - booster
  # Firmware
  - fwupd
  - fwupd-openrc
  - fwupd-efi
  # Monitoring
  - rasdaemon
  - acpid
  - ethtool
  - irqbalance
  - lm_sensors
  - dmidecode
  - earlyoom
  # Memory-safe alternatives
  - uutils
  - uutils-coreutils
  - uutils-coreutils-hostname
  - uutils-coreutils-groups
  - uutils-coreutils-more
  - uutils-coreutils-uptime
  - micro
  - bottom
  - bandwhich
  - sd
  - gping
  - procs
  - viddy
  - ripgrep
  - fd
  - dust
  - bat

# 1. Disk Layouts Definitions
diskLayouts:
  btrfsStandardServer:
    packages: ["btrfs-progs", "cryptsetup", "efibootmgr", "btrbk"]
    modules: ["dm_mod", "dm_crypt", "crc32c_cryptoapi", "zstd", "btrfs", "efivarfs", "nvme"]
  btrfsStandard:
    packages: ["btrfs-progs", "cryptsetup", "efibootmgr", "btrbk"]
    modules: ["dm_mod", "dm_crypt", "crc32c_cryptoapi", "zstd", "btrfs", "efivarfs", "nvme"]

# 2. Desktop Environments Definitions
desktopEnvironments:
  kde:
    packages: ["plasma", "sddm", "konsole", "dolphin", "dbus-x11", "desktop-file-utils", "turnstile"]
    services: {"sddm": "default", "dbus": "default", "turnstile": "default"}
    groups: ["video", "input"]
  niri:
    packages: ["niri", "greetd", "greetd-regreet", "greetd-openrc", "foot", "xdg-desktop-portal-wlr", "pipewire", "polkit-elogind", "turnstile"]
    services: {"greetd": "default", "turnstile": "default"}
    groups: ["video", "input"]

# 3. Video Drivers Definitions
videoDrivers:
  amdgpu:
    packages: ["xf86-video-amdgpu", "mesa-dri-gallium", "mesa-va-gallium", "vulkan-loader"]
    modules: ["amdgpu"]
  nvidia:
    packages: ["nvidia-lts", "nvidia-libs"]
    modules: ["nvidia", "nvidia-modeset"]
  intel:
    packages: ["xf86-video-intel", "mesa-dri-intel"]

# Dynamic logic: if a package is in the install list, apply these changes
packageLogic:
  eudev:
    services: {"udev": "boot", "udev-trigger": "boot", "udev-settle": "boot", "udev-postmount": "default"}
  incus-feature:
    groups: ["incus-admin"]
    services: {"incusd": "default"}
    modules: ["tun", "tap", "veth"]
  qemu-system-x86_64:
    groups: ["kvm", "qemu"]
    modules: ["kvm-amd", "kvm-intel"]
  zram-init:
    services: {"zram-init": "default"}
    modules: ["zram"]
  btrfs-progs:
    services: {"btrfs-scan": "boot"}
    modules: ["btrfs"]
  cryptsetup:
    services: {"dmcrypt": "boot"}
  sudo-rs:
    groups: ["wheel"]
  doas:
    groups: ["wheel"]
  sudo:
    groups: ["wheel"]
  vector:
    services: {"vector": "boot", "vector-setup": "boot"}
  cronie:
    services: {"cronie": "default"}
  chrony:
    services: {"chronyd": "default"}
  dbus:
    services: {"dbus": "default"}
  openssh:
    services: {"sshd": "default"}
  smartmontools:
    services: {"smartd": "default"}
  acpid:
    services: {"acpid": "default"}
  irqbalance:
    services: {"irqbalance": "default"}
  fwupd:
    services: {"fwupd": "default"}
  earlyoom:
    services: {"earlyoom": "default"}
