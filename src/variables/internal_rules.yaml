chrootDir: "/mnt"

# Default system runlevels — only base OS services
# NOTE: 'modules' service not needed with booster (loads /etc/modules automatically)
# NOTE: udev services are in packageLogic under eudev (Alpine uses mdev by default)
# NOTE: dbus-services-setup (feralos-dbus-activate): copies the packaged ADR-010
#       system-bus D-Bus overrides into /usr/local/share/dbus-1/system-services
#       — the launch helper's FIRST eligible dir — before dbus starts. Enabled
#       on both inits (OpenRC initd + dinit unit, same name); no-op when no
#       overrides are installed.
# NOTE: feralos-dbus-audit (boot list): ADR-010 supervision audit oneshot —
#       at boot it re-runs the activation-target audit and writes the report
#       to /var/log/feralos-dbus-audit.log (the installer runs the same
#       audit at the tail of chrootPhase; the aports package ships the
#       binary + both oneshot units).
defaultRunlevels:
  sysinit: ["devfs", "dmesg", "sysctl", "sysfs"]
  boot: ["hwclock", "hostname", "bootmisc", "binfmt", "fsck", "root", "procfs", "loadkmap", "localmount", "klogd", "dbus-services-setup", "feralos-dbus-audit"]
  default: ["cgroups", "cpufrequtils", "networking"]
  shutdown: ["mount-ro", "killprocs", "savecache"]

# Dinit base services — enabled via boot.d symlinks when enableDinit is true.
# This is the dinit counterpart of defaultRunlevels.
#   system: chimera's primary service processor — without it, boot.d is never
#           processed and no services (networking, sshd, etc.) start.
#   getty@tty1/ttyS0: console login on real hardware + serial (harness).
#   dinit-boot-log: mirrors PID1 boot trail to /var/log/dinit/boot.log.
#   klogd: busybox kernel-log forwarder (kernel ring -> /dev/log -> vector
#          kern.log + /var/log/dmesg one-shot); dinit-only — the Alpine
#          OpenRC service needs `logger` (busybox syslogd), which vector
#          replaced (see klogd-dinit package).
#   loadkmap: console keyboard layout — busybox-loadkmap-dinit ships
#          /lib/dinit.d/loadkmap (consumes /etc/conf.d/loadkmap written by
#          misc.go); the chimera early-console hook reads /etc/conf.d/keymaps
#          whose /usr/share/keymaps paths don't exist with kbd-bkeymaps.
defaultRunlevelsDinit:
  boot: ["system", "getty@tty1", "getty@ttyS0", "dinit-boot-log", "klogd", "loadkmap"]

# OpenRC service names that must NOT be dinitctl-enabled:
#   - chimera-covered base services (early chain provides them)
#   - loadkmap: provided dinit-natively (busybox-loadkmap-dinit) and enabled
#     via defaultRunlevelsDinit — skipping here prevents a duplicate boot.d
#     link from the OpenRC boot list (same service name, both lists)
#   - vector-setup: replaced under dinit by vector-dinit's tmpfiles file
#   (ADR-010 R1 amendment 2026-10-25: explicitly-activated system units carry
#   the OpenRC initd name — elogind/polkit/bluetooth — so `services` enables
#   them directly on both inits and NO skip entries are needed anymore; the
#   former polkit/fwupd/bluetooth/elogind skips existed only because those
#   units were bus-named. fwupd is dbus-activated on demand now — never
#   enabled, nothing to skip.)
dinitSkipServices:
  - hwclock
  - hostname
  - bootmisc
  - binfmt
  - fsck
  - root
  - procfs
  - loadkmap
  - localmount
  - swap
  - cgroups
  - udev
  - udev-trigger
  - udev-settle
  - udev-postmount
  - btrfs-scan
  - dmcrypt
  - vector-setup

# Daemons managed ELSEWHERE than a system dinit service — their -openrc
# subpackages are never converted to -dinit (packages.go installDinitPackages):
#   pipewire/pipewire-pulse/wireplumber — user dinit (the session wrapper
#     starts the user manager; system instances would run as root and fight
#     the session ones)
#   alsa-utils (alsasound mixer state) — session audio is pipewire's
#   pulseaudio — replaced by pipewire-pulse (user session)
#   gnome-keyring — per-login-session daemon, never a system service
#   wpa_supplicant — NetworkManager spawns and supervises it itself
#   wireguard-tools — wg-quick is per-interface; WireGuard goes through
#     NetworkManager (native support) or manual config
#   openconnect/vpnc — VPN clients spawned by NetworkManager on demand
#   turnstile — the dinit service (/etc/dinit.d/turnstiled) ships in the MAIN
#     turnstile package (upstream data/dinit, kept: FeralOS dinit is PID 1);
#     there is no turnstile-dinit subpackage. Its -openrc subpackage exists
#     for the OpenRC flow only.
#   oo7-portal / oo7-server — user-session secret daemons (Alpine ships them
#     with -openrc scripts; there are no -dinit variants). The daemons are
#     dbus/session-activated; the -openrc scripts stay installed for the
#     OpenRC fallback boot.
dinitSkipSessionManaged:
  - pipewire
  - pipewire-pulse
  - wireplumber
  - alsa-utils
  - pulseaudio
  - gnome-keyring
  - wpa_supplicant
  - wireguard-tools
  - openconnect
  - vpnc
  - turnstile
  - oo7-portal
  # hyprsunset: on-demand binary (the Wayle night-light module execs it);
  # its -openrc subpackage is a user-session supervisor with no daemon to
  # convert — no -dinit counterpart exists or is needed.
  - hyprsunset
  # xdg-desktop-portal family: SESSION-scoped daemons (frontend/wlr backend/
  # document portal) — supervision is the *-user-dinit packages
  # (xdg-desktop-portal-user-dinit + xdg-desktop-portal-wlr-user-dinit),
  # never a system -dinit unit. Their -openrc subpackages stay installed for
  # the OpenRC fallback; the retired system -dinit units must not be re-pulled.
  - xdg-desktop-portal
  - xdg-desktop-portal-wlr
  - xdg-document-portal
  - oo7-server

# -openrc subpackages whose service is already provided by the dinit-chimera
# suite — never converted to -dinit (their -dinit equivalent does not exist
# and must not be installed):
#   agetty, busybox, udev-init-scripts, util-linux — chimera early chain covers
#   cryptsetup — early-cryptdisks handles /etc/crypttab
#   eudev — early-devd hook (/usr/libexec/dinit-devd) runs /sbin/udevd directly
#   kbd — early-console.target hook (/usr/libexec/dinit-console)
#   makedumpfile — kdump handled by chimera early-kdump/try-kdump
#   logrotate — runs via /etc/periodic/daily (cronie), init-agnostic: no
#     service needed under either init (logrotate-dinit does not exist)
#   (incus-feature NOT skipped anymore: incus-feature-dinit ships incusd)
dinitReplacedByChimera:
  - agetty
  - busybox
  - btrfs-progs   # btrfs device scan: covered by chimera early-fs-btrfs
  - cryptsetup
  - eudev
  - kbd
  - logrotate
  - makedumpfile
  - udev-init-scripts
  - util-linux

# Fixed system packages — matches reference skeaSimpleServer exactly
standardPackages:
  # Core
  - sudo-rs
  - musl-locales
  - lang
  - tzdata
  - kbd-bkeymaps
  - font-terminus
  # Secure Boot / UKI
  - efi-mkuki
  - openssl
  - ca-certificates
  - efibootmgr
  # Filesystem / Crypto
  - linux-lts
  - btrfs-progs
  - cryptsetup
  - zstd
  - dosfstools   # real fsck.vfat (busybox stub lacks -C, errors at boot fsck)
  # Services
  - cronie
  - cpufrequtils       # CPU governor settings (dinit service via conversion; skips on VMs)
  - chrony
  - dbus
  # ADR-010: D-Bus activation shim (every activation starts a dinit unit) +
  # the dbus-services-setup boot materializer that copies the packaged system-
  # bus overrides into /usr/local/share/dbus-1/system-services (the launch
  # helper's first eligible dir — /etc is daemon-enumerated but NOT helper-
  # activatable). Installed everywhere; the setup unit is enabled on both
  # inits and no-ops without overrides.
  - feralos-dbus-activate
  # ADR-010 enforcement: supervision audit binary + boot oneshot units
  # (dinit unit + OpenRC initd in the package). The installer RUNS this
  # packaged binary (chroot step 8a, --no-fail) — it does NOT compile it:
  # the aports package is the single source of truth, bump its _commit pin
  # whenever src/firstBoot/dbus-audit changes.
  - feralos-dbus-audit
  - shadow
  - eudev
  - udev-init-scripts
  - openssh
  # rsync: file-level copy/sync (btrfs snapshots cover images; rsync covers
  # arbitrary dirs — user request 2026-11-09)
  - rsync
  - mount
  - sed
  - blkid
  # grep: provided by busybox (POSIX BRE, supports \+)
  # Hardware
  - pciutils
  - usbutils
  - smartmontools
  # Logging
  # logrotate: vector does NOT rotate files — it only tails rotated ones
  # (copytruncate recommended by vector docs). Covers vector sinks AND
  # dinit service logs; runs via /etc/periodic/daily (cronie).
  - logrotate
  - vector
  # klogd-openrc: our klogd (989 series) replaces the vendor busybox-openrc
  # script, which can never start here (`depend() need logger` — busybox
  # syslogd was replaced by vector). ALWAYS installed (both inits): inert
  # under dinit, required for an OpenRC fallback boot. The dinit
  # counterpart (klogd-dinit) ships in the dinit init bundle (packages.go,
  # EnableDinit-gated — init plumbing, not distro content).
  - klogd-openrc
  # Shell
  - fish
  - fish-tools
  # Initramfs (booster replaces mkinitfs)
  - booster
  # Firmware
  - fwupd
  - fwupd-efi
  # Monitoring
  - rasdaemon
  - acpid
  - ethtool
  - irqbalance
  - lm_sensors
  - dmidecode
  - earlyoom
  # Memory-safe alternatives
  - uutils
  - uutils-coreutils
  - uutils-coreutils-hostname
  - uutils-coreutils-groups
  # NOTE: uutils-coreutils-more was removed due to conflict with util-linux-misc
  # incus-feature-vm depends on util-linux-misc, so uutils-coreutils-more cannot coexist
  # Now using dummy packages: providePackages creates dummy util-linux-misc
  # so incus dependency is satisfied, while uutils-coreutils-more provides /usr/bin/more
  - uutils-coreutils-more
  - uutils-coreutils-uptime
  - micro
  - bottom
  - bandwhich
  - sd
  - gping
  - procs
  - viddy
  - ripgrep
  - fd
  # less shim (feralos-aports): /usr/bin/less is a flag-translating wrapper
  # that execs moor. NOT a symlink less→moor — moor rejects the hardcoded
  # less CLI flags tools pass (fish `history`, `git log`, `man` all pipe
  # to $PAGER with less flags), so the symlink made moor error
  # ("unexpected argument '-R'") instead of showing content.
  - less-dummy
  # Firewall
  - firewalld
  # XDG user dirs (for flatpak portal access)
  - xdg-user-dirs

# Fixed supplementary groups the primary user always joins (users.go
# setupStandardGroups). The dynamic per-package groups are separate
# (packageLogic/DE `groups` — created on demand by setupUserGroups).
standardUserGroups: [lp, input, cdrom, dialout, video, netdev, plugdev, users]

# FeralOS package repository bootstrap (packages.go bootstrapFeralosRepo):
# the keyring apk adds the signing key + the repositories.d entry.
feralosRepo:
  keyringUrl: "https://skea999.github.io/feralos-aports/feralos-aports/x86_64/feralos-keyring-1-r0.apk"

# Kernel flavor consumed by the UKI/boot chain (uki.go booster-<flavor>.img,
# linux-<flavor>.efi, /boot/vmlinuz-<flavor>) and by the EFI sync APK hook
# (hooks.go targetPkg). The kernel PACKAGE itself ships in standardPackages.
kernel:
  package: "linux-lts"
  flavor: "lts"

# CPU microcode (packages.go install + boot.go/uki.go UKI assembly).
# Selected at install time from /proc/cpuinfo (amd / intel keys).
microcode:
  amd:
    package: "amd-ucode"
    image: "/boot/amd-ucode.img"
  intel:
    package: "intel-ucode"
    image: "/boot/intel-ucode.img"

# @edge tagged repositories appended by features/edgerepos.go when
# enableEdgeRepos is set (mirror prefix comes from the user `mirror`
# variable). Commented back out after the edge install.
edgeRepositories: [edge/main, edge/community, edge/testing]

# chroot /etc/resolv.conf written BEFORE the first apk update (DNS needed
# for apk) — chroot_phase.go step 0.
resolvNameservers: [208.67.222.222, 208.67.220.220]

# Maintenance schedules (crontab lines; command part fixed in Go):
#   apkAudit   — weekly apk audit (misc.go)
#   trim       — weekly TRIM via /etc/periodic/weekly/btrfs-trim (storage.go)
#   scrub      — weekly btrfs scrub (storage.go)
#   snapshots  — daily btrbk snapshots (storage.go)
maintenanceCron:
  apkAudit: "0 4 * * 0"
  trim: "0 3 * * 0"
  scrub: "30 3 * * 0"
  snapshots: "0 2 * * *"

# /etc/security/limits.conf nofile values (users.go setupLimits).
limits:
  nofileDefault: 100000
  nofileUser: 524288

# Nix pins consumed by features/nix.go under enableNix: the stable channel
# and the flake registry ref (system-wide /etc/nix/registry.json + user
# `nix registry add nixpkgs github:NixOS/nixpkgs/<registryRef>`).
nix:
  channel: "https://nixos.org/channels/nixos-26.05"
  registryRef: "nixos-26.05"

# /etc/booster.yaml tunables (chrootPhase/internal/boot.go SetupBoot).
# network mirrors booster.yaml's own sub-block shape (network.dhcp:
# off/on — dhcp: false renders "off"); mount_timeout is a booster duration
# string.
boosterConfig:
  compression: zstd
  extraFiles: "busybox,mount,btrfs"
  mountTimeout: "3m"
  network:
    dhcp: false

# 1. Disk Layouts Definitions
diskLayouts:
  btrfsStandardServer:
    packages: ["btrfs-progs", "cryptsetup", "efibootmgr", "btrbk"]
    modules: ["dm_mod", "dm_crypt", "crc32c_cryptoapi", "zstd", "btrfs", "efivarfs", "nvme"]
  btrfsStandard:
    packages: ["btrfs-progs", "cryptsetup", "efibootmgr", "btrbk"]
    modules: ["dm_mod", "dm_crypt", "crc32c_cryptoapi", "zstd", "btrfs", "efivarfs", "nvme"]
  btrfsRaid0:
    packages: ["btrfs-progs", "cryptsetup", "efibootmgr", "btrbk"]
    modules: ["dm_mod", "dm_crypt", "crc32c_cryptoapi", "zstd", "btrfs", "efivarfs", "nvme"]
  # No LUKS → omits dm_mod/dm_crypt (docs/architecture/storage.md#common)
  btrfsUnencrypted:
    packages: ["btrbk"]
    modules: ["crc32c_cryptoapi", "zstd", "btrfs", "efivarfs", "nvme"]

# 2. Desktop Environments Definitions
#
# ADR-010 R1b (2026-11-03): the dbus-activated supervision packages
# (*-dinit / *-user-dinit) are NOT listed here — feralos-dbus-audit
# (chroot step 8a) discovers every activation target and apk-adds the
# daemon-named counterpart automatically (<owner-of-Exec>-user-dinit /
# <owner-of-Exec>-dinit). The only *-user-dinit entries below are the
# NON-activatable infra the audit cannot derive (no activation file
# references them): core session infra (dbus/pipewire/wireplumber/
# wayland-wait), the session script (niri-user-dinit), session-scoped
# daemons (polkit-agent/wayvnc — started by the session script), the
# login-scope override materializer, and override-only targets with no
# upstream activation file (kglobalaccel, cosmic-applets).
desktopEnvironments:
  kde:
    packages: ["plasma", "sddm", "konsole", "dolphin", "dbus-x11", "desktop-file-utils", "ursine", "turnstile", "dbus-session-materializer-user-dinit", "kglobalaccel-user-dinit"]
    services: {"sddm": "default", "dbus": "default", "turnstiled": "default", "ursined": "default"}
    groups: ["video", "input"]
  niri:
    packages: ["niri", "niri-portalsconf", "greetd", "greetd-regreet", "elogind", "ursine", "alacritty", "xdg-desktop-portal-wlr", "xdg-desktop-portal-gtk", "polkit-elogind", "polkit-gnome", "xwayland-satellite", "xwayland", "mesa-dri-gallium", "wayland-libs-server", "dms-shell", "dms-window-buttons", "matugen", "turnstile", "niri-user-dinit", "power-profiles-daemon", "dbus-user-dinit", "pipewire-user-dinit", "pipewire-pulse-user-dinit", "wireplumber-user-dinit", "wayland-wait-user-dinit", "seahorse", "polkit-agent-user-dinit", "wayvnc", "wayvnc-user-dinit", "networkmanager", "networkmanager-cli", "networkmanager-tui", "networkmanager-wifi", "wireless-regdb", "bluez", "wpa_supplicant", "wireguard-tools", "qt6-qtmultimedia", "i2c-tools", "wtype", "simple-scan", "sane", "sane-backends", "sane-utils", "sane-airscan", "gnome-keyring", "cosmic-edit", "eog", "cups", "cups-filters", "avahi", "cosmic-player", "libreoffice", "galculator", "firefox", "gnome-firmware", "khal", "adw-gtk3", "dconf", "font-inconsolata", "font-dejavu", "font-noto", "font-noto-cjk", "font-awesome", "font-noto-extra", "gnome-maps", "gnome-calendar"]
    # Admin GUIs (cron/logs/disks/firewall) are NOT installed: ursine is the
    # control center for those (kcron, ksystemlog, gnome-disk-utility,
    # firewalld-gui removed). Flatseal STAYS — Ursine's Flatpak permissions
    # editor covers sockets/devices/filesystems/env only, not the session
    # bus policies. simple-scan and gnome-firmware stay — Ursine's scanner
    # page is SANE setup only and it has no firmware-update module.
    flatpakPackages: ["io.github.zarestia_dev.rclone-manager", "com.github.tchx84.Flatseal"]
    # turnstile + niri-user-dinit: PAM session → user dinit (turnstiled);
    # Alpine niri-session's dinit branch starts the `niri` user service.
    # DUAL-INIT: turnstiled runs as a system service on BOTH inits (dinit:
    # boot.d link; OpenRC: rc-update — service ships in the turnstile-openrc
    # subpackage). The dinit USER backend is identical on both, so the
    # -user-dinit session stack below works under OpenRC too.
    # Login-shell trick: passwd shell = /usr/libexec/login-shell (wired by
    # the desktop setup: desktops/niri.go / niri_wayle.go). The shell IS
    # listed in /etc/shells (pkexec requirement); the trick is that it is
    # NOT the fish binary itself (a symlink to fish), so niri-session's
    # bash re-exec check is bypassed.
    # cava (DMS audio visualizer) NOT on Alpine v3.24 — re-add when packaged
    # firewalld on Alpine is NFTABLES-ONLY: the APKBUILD builds
    # --without-iptables --without-ip6tables --without-ebtables, and nftables
    # arrives as firewalld's own hard dep. The old iptables/ip6tables/ebtables
    # trio was ONE apk (iptables — ip6tables/ebtables are only virtual
    # provides of it) that firewalld never uses; removed. enablePodman still
    # installs iptables for podman's own networking (features/podman.go).
    # accountsservice + udisks2 are NOT listed either: they are hard
    # requirements of ursine's Users/Disks modules (zbus
    # org.freedesktop.Accounts with zero fallback; udisksctl for
    # mount/unmount with no mount/umount fallback), so they ship as
    # `depends=` of the ursine aports package instead of per-DE entries.
    # audio stack = user dinit services (pipewire-user-dinit + deps pull
    # pipewire/pipewire-pulse/wireplumber as runtime deps; session-supervised)
    # NetworkManager replaces ifupdown as the network service (DMS network/VPN
    # UI needs the NM backend; /etc/network/interfaces reduced to lo by the
    # desktop setup, NM manages eth0 — FIX-niri-dms.md rounds 30/44)
    # networkmanager-wifi: NM wifi PLUGIN subpackage (Alpine splits it) —
    # without it NM has NO wifi support and the DMS network widget shows no
    # wifi at all. wireless-regdb = regulatory table (real radios need it);
    # wpa_supplicant already in the list (NM spawns/supervises it itself).
    # bluez: DMS bluetooth widget speaks the org.bluez dbus API. The
    # -openrc/-dinit service packages are NOT listed: Alpine auto-pulls
    # bluez-openrc (install_if), the dinit conversion turns it into
    # bluez-dinit. Service name UNIFIED at "bluetooth" on BOTH inits
    # (feralos bluez-dinit r2 ships /lib/dinit.d/bluetooth — we own the
    # package, aports e9ac00c) → the single "bluetooth": "default" in the
    # services map below enables it for dinit AND OpenRC, niri-only
    # (desktop services map is merged into the per-desktop Runlevels, not
    # the base defaultRunlevels).
    # wayvnc = VNC server (round 37) — RustDesk flatpak REMOVED (round 43
    # cleanup philosophy: not part of the validated stack)
    services: {"greetd": "default", "elogind": "default", "firewalld": "default", "polkit": "default", "cupsd": "default", "networkmanager": "default", "bluetooth": "default", "ursined": "default", "turnstiled": "default"}
    # turnstiled: PAM module talks to it over its socket at login; it spawns
    # the per-user dinit. DUAL-INIT (services.go drives both): dinit gets the
    # boot.d link (the unit ships in /etc/dinit.d/turnstiled — the enablement
    # resolves /lib first, /etc fallback), OpenRC rc-update default (ALWAYS
    # enabled — a dinit install must stay OpenRC-bootable). The service ships
    # in the turnstile-openrc subpackage (same daemon, same dinit user
    # backend — turnstile is service-manager-agnostic).
    # ADR-010 R1 amendment: explicitly-activated system units carry the OpenRC
    # initd name, so `services` alone drives both inits (dinitServices stays
    # empty). PPD (org.freedesktop.UPower.PowerProfiles) is dbus-activated on
    # demand — never boot-enabled; dbus decides when it runs.
    # render group does not exist on Alpine (video covers DRM access);
    # audio group: /dev/snd/* for pipewire (real-hardware audio);
    # plugdev: NM polkit rule allows GUI connection management (round 30);
    # lpadmin: CUPS SystemGroup (printer admin — cups-files.conf default)
    groups: ["video", "input", "audio", "plugdev", "netdev", "lpadmin"]
    # greeter groups: the `greeter` user joins these (usermod -aG, desktop
    # setup) — greetd re-owns /var/lib/greetd 0750 at boot (traversal).
    greeterGroups: [video, input, greetd]
    # User dinit boot.d infrastructure units (desktop setup links them into
    # /usr/lib/dinit.d/user/boot.d, existence-filtered). SHAPE: verbatim unit
    # file names INCLUDING the `.user` suffix — the consumer joins them with
    # spaces into the shell loop unchanged. Session apps (polkit-agent/dms/
    # wayvnc) are NOT here — the session script starts them (add-wants model).
    userServices: ["dbus.user", "pipewire.user", "pipewire-pulse.user", "wireplumber.user", "wait-wayland.user", "org.freedesktop.portal.Desktop.user", "org.freedesktop.portal.Documents.user", "org.freedesktop.impl.portal.PermissionStore.user"]
    # DMS 1.6.x + quickshell 0.3.x ship as NATIVE apk packages (feralos-aports)
    # — the nix stack (dms-shell/quickshell/dgop/nixGL/execfilter) is gone.
    # matugen (dynamic wallpaper theming backend) now ships from OUR repo
    # (feralos-aports 4.2.0 — absent in Alpine): dms-shell runs it for
    # wallpaper palettes; the generated DankMatugen KColorScheme export is
    # what the dms-theme-sync plugin propagates to GTK/Qt/KDE. rclone-ui
    # remains unpackaged (unrelated to the desktop stack).
    # RustDesk removed (round 43 cleanup + user decision): wayvnc is the
    # remote-desktop path (user dinit service, loopback by default).
  niriWayle:
    packages: ["niri", "greetd", "greetd-regreet", "elogind", "ursine", "alacritty", "polkit-elogind", "xwayland-satellite", "xwayland", "mesa-dri-gallium", "xdg-desktop-portal-wlr", "turnstile", "wl-clipboard-rs", "wayle", "wayle-session", "veila", "stasis", "raffi", "raffi-toggle", "oo7", "matugen", "power-profiles-daemon", "dbus-user-dinit", "pipewire-user-dinit", "pipewire-pulse-user-dinit", "wireplumber-user-dinit", "wayland-wait-user-dinit", "polkit-agent-user-dinit", "wayvnc", "wayvnc-user-dinit", "networkmanager", "networkmanager-cli", "networkmanager-tui", "networkmanager-wifi", "wireless-regdb", "bluez", "wpa_supplicant", "wireguard-tools", "wtype", "i2c-tools", "dconf", "adwaita-icon-theme", "adw-gtk3", "font-inconsolata", "font-dejavu", "font-noto-cjk", "font-noto-emoji", "font-awesome", "font-noto-extra", "cosmic-edit", "cosmic-player", "cosmic-files", "eog", "evince", "file-roller", "libreoffice", "galculator", "firefox", "thunderbird", "gnome-firmware", "gnome-maps", "simple-scan", "obs-studio", "gst-libav", "cups", "cups-filters", "avahi", "sane", "sane-backends", "sane-utils", "sane-airscan"]
    # Key Rack (app.drey.KeyRack) = the niriWayle secrets GUI — Flathub
    # flatpak, NOT an apk: oo7-server and seahorse both ship
    # /usr/share/dbus-1/services/org.freedesktop.secrets.service, so the
    # seahorse apk CANNOT coexist with the oo7 stack (file conflict = the
    # apk world stays permanently broken). nixpkgs only has Key Rack 0.4.0
    # (too old). Flathub ships current 0.6.x (Rust + native oo7 client).
    flatpakPackages: ["app.drey.KeyRack", "io.github.zarestia_dev.rclone-manager", "com.github.tchx84.Flatseal", "com.logseq.Logseq"]
    # niriWayle: niri compositor + Wayle shell (bar/notifications/OSD/wallpaper)
    # + Veila lock screen + Raffi launcher + oo7 secrets (gnome-keyring replacement).
    # Shares the session infra with niri: turnstile + per-user dinit, pipewire
    # stack via *-user-dinit, portals, polkit agent, wayvnc.
    # wayle-session depends on niri-user-dinit (login-shell + niri user service)
    # + stasis, and ships the wayle-session script + wayle.user/veila.user
    # (veilad runs through the veilad-session env wrapper) + niriwayle.desktop.
    # stasis (context-aware idle manager; supervised stasis.user session service
    # started by the session script; FeralOS system config /etc/stasis/stasis.rune
    # = veila lock -> niri dpms -> loginctl suspend) is listed EXPLICITLY and
    # also pulled via the wayle-session dependency; veila remains the lock
    # screen (ext-session-lock; idle timing owned by stasis).
    # Apps = productivity/media set + support (printing, scanning, Qt/KDE
    # image+media plugins, adw-gtk3) + rclone-manager + Flatseal alongside
    # Key Rack. Admin GUIs (cron/logs/disks/firewall) are NOT installed:
    # ursine is the control center for those; Flatseal stays because Ursine
    # does not edit Flatpak session-bus policies. simple-scan stays
    # (Ursine's scanner page is SANE setup only; image scanning was removed
    # upstream). NOT copied: the DMS shell packages (niri-only) and
    # seahorse/gnome-keyring (oo7 + Key Rack own secrets; seahorse conflicts
    # on org.freedesktop.secrets.service).
    services: {"greetd": "default", "elogind": "default", "firewalld": "default", "polkit": "default", "cupsd": "default", "networkmanager": "default", "bluetooth": "default", "ursined": "default", "turnstiled": "default"}
    # turnstiled: same dual-init wiring as niri (see above) — PAM → per-user
    # dinit at login; enablement driven by services.go on both inits.
    # ADR-010 R1 amendment: services alone drives both inits (see niri). PPD =
    # dbus-activated on demand. upowerd/udisksd etc. are dbus system-activated
    # on demand (Wayle queries org.freedesktop.UPower) — the supervision
    # package (upower-dinit, daemon-named per R1b) is auto-installed by
    # feralos-dbus-audit, never listed here; both inits work (OpenRC system
    # bus = raw-exec fallback through the shim).
    groups: ["video", "input", "audio", "plugdev", "netdev", "lpadmin"]
    greeterGroups: [video, input, greetd]
    # Same shape as niri's userServices (verbatim `.user` unit names) plus the
    # oo7 secrets stack: org.freedesktop.secrets (oo7-server daemon) +
    # org.freedesktop.impl.portal.desktop.oo7 (the oo7 Secret portal).
    userServices: ["dbus.user", "pipewire.user", "pipewire-pulse.user", "wireplumber.user", "wait-wayland.user", "org.freedesktop.secrets.user", "org.freedesktop.impl.portal.desktop.oo7.user", "org.freedesktop.portal.Desktop.user", "org.freedesktop.portal.Documents.user", "org.freedesktop.impl.portal.PermissionStore.user"]
  cosmic:
    packages: ["cosmic-session", "cosmic-term", "cosmic-greeter", "cosmic-edit", "cosmic-player", "cosmic-store", "cosmic-settings", "cosmic-screenshot", "cosmic-icons", "cosmic-initial-setup", "adwaita-icon-theme", "desktop-file-utils", "hicolor-icon-theme", "elogind", "dbus", "polkit", "ursine", "pipewire", "xdg-desktop-portal-cosmic", "turnstile", "dbus-session-materializer-user-dinit", "cosmic-applets-user-dinit"]
    services: {"cosmic-greeter": "default", "elogind": "default", "dbus": "default", "turnstiled": "default", "ursined": "default"}
    # Seat manager = elogind (same as niri/niriWayle/kde): turnstiled depends
    # on the elogind unit (OpenRC initd name per the ADR-010 R1 amendment), so
    # the user dinit + dbus-session-materializer stack works. cosmic-comp
    # reaches the seat through libseat's logind backend (libseat pkg,
    # transitive; Alpine 3.24 verified: NOTHING depends on the seatd daemon,
    # it is gone). NO "seat" group: the group came from the seatd package
    # (absent here); elogind manages device ACLs itself.
    # elogind-dinit NOT listed: -openrc/-dinit variants auto-pull/convert.
    groups: ["video", "input"]

# 3. Video Drivers Definitions
videoDrivers:
  amdgpu:
    # mesa-vulkan-ati = RADV ICD (Alpine renamed from mesa-vulkan-radeon);
    # vulkan-loader required separately (ICD does not pull it).
    # VDPAU (mesa-vdpau-gallium) removed upstream in mesa >=25 — VA-API only.
    packages: ["xf86-video-amdgpu", "mesa-dri-gallium", "mesa-va-gallium", "mesa-vulkan-ati", "vulkan-loader", "linux-firmware-amdgpu"]
    modules: ["amdgpu"]
  nvidia:
    packages: ["nvidia-lts", "nvidia-libs"]
    modules: ["nvidia", "nvidia-modeset"]
  intel:
    packages: ["mesa-dri-gallium", "mesa-va-gallium", "mesa-vulkan-intel", "intel-media-driver", "libva-intel-driver", "linux-firmware-i915"]
  virtio:
    # QEMU virtio-gpu userspace (virgl/venus pipe for virtio-gpu-gl)
    packages: ["mesa-dri-gallium", "mesa-vulkan-virtio"]
    modules: ["virtio_gpu"]

# Dummy packages: if key is installed, creates symlink for replaced package
# Symlink goes from /usr/bin/<replaced> → /usr/bin/<replacement>
# Bin overrides replacement binary name (e.g. ripgrep → rg)
# NOTE: grep NOT replaced — rg doesn't support GNU regex extensions (\+)
# NOTE: less NOT replaced here — a symlink less→moor crashes: moor cannot
# parse the hardcoded less flags tools pass (unexpected argument errors).
# less ships as the aports package `less-dummy` instead
# (provides less=999, /usr/bin/less = wrapper script → moor after flag drop).
dummyPackages: {}

# Dynamic logic: if a package is in the install list, apply these changes
packageLogic:
  eudev:
    services: {"udev": "boot", "udev-trigger": "boot", "udev-settle": "boot", "udev-postmount": "default"}
  incus:
    groups: ["incus-admin"]
    services: {"incusd": "default"}
    modules: ["tun", "tap", "veth", "overlay"]
  incus-feature:
    packages: ["incus-feature-vm", "incus-feature-client", "incus-feature-utils", "bridge", "bridge-utils"]
    groups: ["incus-admin"]
    services: {"incusd": "default"}
    # 8021q was provided by the 'vlan' package rule — removed: the vlan package
    # conflicts with ifupdown-ng (required by networking-dinit); ifupdown-ng
    # handles vlan interfaces itself
    modules: ["tun", "tap", "bonding", "veth", "overlay", "8021q"]
  incus-feature-vm:
    packages: ["qemu-system-x86_64", "qemu-img", "qemu-modules"]
  qemu-system-x86_64:
    groups: ["kvm", "qemu"]
    modules: ["kvm"]
  podman:
    # packages owned by features/podman.go (confinement); rules cover
    # groups/services/modules when podman arrives via any path
    services: {"podman": "default", "cgroups": "default"}
    modules: ["overlay"]
  zram-init:
    services: {"zram-init": "default"}
    modules: ["zram"]
  btrfs-progs:
    services: {"btrfs-scan": "boot"}
    modules: ["btrfs"]
  cryptsetup:
    services: {"dmcrypt": "boot"}
  sudo-rs:
    groups: ["wheel"]
  doas:
    groups: ["wheel"]
  sudo:
    groups: ["wheel"]
  vector:
    services: {"vector": "boot", "vector-setup": "boot"}
  cronie:
    services: {"cronie": "default"}
  chrony:
    services: {"chronyd": "default"}
  dbus:
    services: {"dbus": "default"}
  openssh:
    services: {"sshd": "default"}
  smartmontools:
    services: {"smartd": "default"}
  acpid:
    services: {"acpid": "default"}
  irqbalance:
    services: {"irqbalance": "default"}
  # ADR-010 R1 amendment: fwupd is dbus-activated ON DEMAND (heavy daemon,
  # dbus decides when it runs) — never boot-enabled, no initd enablement on
  # either init. Activation routes through the shim to the bus-named unit
  # (supervised under dinit; OpenRC fallback = raw exec, documented).
  # No rule body needed — this comment is the record (an empty YAML key
  # parses as null and carries no data).
  earlyoom:
    services: {"earlyoom": "default"}
  vlan:
    modules: ["8021q"]
  bridge:
    modules: ["bridge", "br_netfilter"]
  zstd:
    modules: ["zstd_compress"]
  docker:
    groups: ["docker"]
    services: {"docker": "default"}
    modules: ["overlay"]

# Packages to always provide as dummy (regardless of replacement)
# Used to satisfy dependencies without installing the real package
providePackages: []


# Base modules always loaded via modules_force_load in booster
# These are kernel modules without specific packages (hardware drivers, kernel features)
# virtio* needed for QEMU target (virtio-net-pci, virtio-blk-pci)
baseModules:
  - r8169
  - binfmt_misc
  - sd_mod
  - sr_mod
  - ata_piix
  - ahci
  - nvme
  - virtio
  - virtio_pci
  - virtio_net
  - virtio_blk
  - virtio_scsi
