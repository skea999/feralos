chrootDir: "/mnt"

# Default system runlevels — only base OS services
# NOTE: 'modules' service not needed with booster (loads /etc/modules automatically)
# NOTE: udev services are in packageLogic under eudev (Alpine uses mdev by default)
# NOTE: dbus-services-setup (feralos-dbus-activate): copies the packaged ADR-010
#       system-bus D-Bus overrides into /usr/local/share/dbus-1/system-services
#       — the launch helper's FIRST eligible dir — before dbus starts. Enabled
#       on both inits (OpenRC initd + dinit unit, same name); no-op when no
#       overrides are installed.
defaultRunlevels:
  sysinit: ["devfs", "dmesg", "sysctl", "sysfs"]
  boot: ["hwclock", "hostname", "bootmisc", "binfmt", "fsck", "root", "procfs", "loadkmap", "localmount", "klogd", "dbus-services-setup"]
  default: ["cgroups", "cpufrequtils", "networking"]
  shutdown: ["mount-ro", "killprocs", "savecache"]

# Dinit base services — enabled via boot.d symlinks when enableDinit is true.
# This is the dinit counterpart of defaultRunlevels.
#   system: chimera's primary service processor — without it, boot.d is never
#           processed and no services (networking, sshd, etc.) start.
#   getty@tty1/ttyS0: console login on real hardware + serial (harness).
#   dinit-boot-log: mirrors PID1 boot trail to /var/log/dinit/boot.log.
#   klogd: busybox kernel-log forwarder (kernel ring -> /dev/log -> vector
#          kern.log + /var/log/dmesg one-shot); dinit-only — the Alpine
#          OpenRC service needs `logger` (busybox syslogd), which vector
#          replaced (see klogd-dinit package).
#   loadkmap: console keyboard layout — busybox-loadkmap-dinit ships
#          /lib/dinit.d/loadkmap (consumes /etc/conf.d/loadkmap written by
#          misc.go); the chimera early-console hook reads /etc/conf.d/keymaps
#          whose /usr/share/keymaps paths don't exist with kbd-bkeymaps.
defaultRunlevelsDinit:
  boot: ["system", "getty@tty1", "getty@ttyS0", "dinit-boot-log", "klogd", "loadkmap"]

# OpenRC service names that must NOT be dinitctl-enabled:
#   - chimera-covered base services (early chain provides them)
#   - loadkmap: provided dinit-natively (busybox-loadkmap-dinit) and enabled
#     via defaultRunlevelsDinit — skipping here prevents a duplicate boot.d
#     link from the OpenRC boot list (same service name, both lists)
#   - vector-setup: replaced under dinit by vector-dinit's tmpfiles file
#   (ADR-010 R1 amendment 2026-10-25: explicitly-activated system units carry
#   the OpenRC initd name — elogind/polkit/bluetooth — so `services` enables
#   them directly on both inits and NO skip entries are needed anymore; the
#   former polkit/fwupd/bluetooth/elogind skips existed only because those
#   units were bus-named. fwupd is dbus-activated on demand now — never
#   enabled, nothing to skip.)
dinitSkipServices:
  - hwclock
  - hostname
  - bootmisc
  - binfmt
  - fsck
  - root
  - procfs
  - loadkmap
  - localmount
  - swap
  - cgroups
  - udev
  - udev-trigger
  - udev-settle
  - udev-postmount
  - btrfs-scan
  - dmcrypt
  - vector-setup

# -openrc subpackages whose service is already provided by the dinit-chimera
# suite — never converted to -dinit (their -dinit equivalent does not exist
# and must not be installed):
#   agetty, busybox, udev-init-scripts, util-linux — chimera early chain covers
#   cryptsetup — early-cryptdisks handles /etc/crypttab
#   eudev — early-devd hook (/usr/libexec/dinit-devd) runs /sbin/udevd directly
#   kbd — early-console.target hook (/usr/libexec/dinit-console)
#   makedumpfile — kdump handled by chimera early-kdump/try-kdump
#   logrotate — runs via /etc/periodic/daily (cronie), init-agnostic: no
#     service needed under either init (logrotate-dinit does not exist)
#   (incus-feature NOT skipped anymore: incus-feature-dinit ships incusd)
dinitReplacedByChimera:
  - agetty
  - busybox
  - btrfs-progs   # btrfs device scan: covered by chimera early-fs-btrfs
  - cryptsetup
  - eudev
  - kbd
  - logrotate
  - makedumpfile
  - udev-init-scripts
  - util-linux

# Fixed system packages — matches reference skeaSimpleServer exactly
standardPackages:
  # Core
  - sudo-rs
  - musl-locales
  - lang
  - tzdata
  - kbd-bkeymaps
  - font-terminus
  # Secure Boot / UKI
  - efi-mkuki
  - openssl
  - ca-certificates
  - efibootmgr
  # Filesystem / Crypto
  - linux-lts
  - btrfs-progs
  - cryptsetup
  - zstd
  - dosfstools   # real fsck.vfat (busybox stub lacks -C, errors at boot fsck)
  # Services
  - cronie
  - cpufrequtils       # CPU governor settings (dinit service via conversion; skips on VMs)
  - chrony
  - dbus
  # ADR-010: D-Bus activation shim (every activation starts a dinit unit) +
  # the dbus-services-setup boot materializer that copies the packaged system-
  # bus overrides into /usr/local/share/dbus-1/system-services (the launch
  # helper's first eligible dir — /etc is daemon-enumerated but NOT helper-
  # activatable). Installed everywhere; the setup unit is enabled on both
  # inits and no-ops without overrides.
  - feralos-dbus-activate
  - shadow
  - eudev
  - udev-init-scripts
  - openssh
  - mount
  - sed
  - blkid
  # grep: provided by busybox (POSIX BRE, supports \+)
  # Hardware
  - pciutils
  - usbutils
  - smartmontools
  # Logging
  # logrotate: vector does NOT rotate files — it only tails rotated ones
  # (copytruncate recommended by vector docs). Covers vector sinks AND
  # dinit service logs; runs via /etc/periodic/daily (cronie).
  - logrotate
  - vector
  # Shell
  - fish
  - fish-tools
  # Initramfs (booster replaces mkinitfs)
  - booster
  # Firmware
  - fwupd
  - fwupd-efi
  # Monitoring
  - rasdaemon
  - acpid
  - ethtool
  - irqbalance
  - lm_sensors
  - dmidecode
  - earlyoom
  # Memory-safe alternatives
  - uutils
  - uutils-coreutils
  - uutils-coreutils-hostname
  - uutils-coreutils-groups
  # NOTE: uutils-coreutils-more was removed due to conflict with util-linux-misc
  # incus-feature-vm depends on util-linux-misc, so uutils-coreutils-more cannot coexist
  # Now using dummy packages: providePackages creates dummy util-linux-misc
  # so incus dependency is satisfied, while uutils-coreutils-more provides /usr/bin/more
  - uutils-coreutils-more
  - uutils-coreutils-uptime
  - micro
  - bottom
  - bandwhich
  - sd
  - gping
  - procs
  - viddy
  - ripgrep
  - fd
  - dust
  - bat
  # less shim (feralos-aports): /usr/bin/less is a flag-translating wrapper
  # that dumps via `bat --paging=never`. NOT a symlink less→bat — bat rejects
  # the hardcoded less CLI flags it itself passes to its pager
  # (`less -R -F -K --no-init` on TTY), so the symlink made bat re-exec
  # itself and clap errored ("unexpected argument '-R'") — broke fish
  # `history`, `git log`, `man` (anything piping to $PAGER on a TTY).
  - less-dummy
  # Firewall
  - firewalld
  # XDG user dirs (for flatpak portal access)
  - xdg-user-dirs

# 1. Disk Layouts Definitions
diskLayouts:
  btrfsStandardServer:
    packages: ["btrfs-progs", "cryptsetup", "efibootmgr", "btrbk"]
    modules: ["dm_mod", "dm_crypt", "crc32c_cryptoapi", "zstd", "btrfs", "efivarfs", "nvme"]
  btrfsStandard:
    packages: ["btrfs-progs", "cryptsetup", "efibootmgr", "btrbk"]
    modules: ["dm_mod", "dm_crypt", "crc32c_cryptoapi", "zstd", "btrfs", "efivarfs", "nvme"]
  btrfsRaid0:
    packages: ["btrfs-progs", "cryptsetup", "efibootmgr", "btrbk"]
    modules: ["dm_mod", "dm_crypt", "crc32c_cryptoapi", "zstd", "btrfs", "efivarfs", "nvme"]
  # No LUKS → omits dm_mod/dm_crypt (docs/architecture/storage.md#common)
  btrfsUnencrypted:
    packages: ["btrbk"]
    modules: ["crc32c_cryptoapi", "zstd", "btrfs", "efivarfs", "nvme"]

# 2. Desktop Environments Definitions
desktopEnvironments:
  kde:
    packages: ["plasma", "sddm", "konsole", "dolphin", "dbus-x11", "desktop-file-utils", "ursine", "plasma-kauth-dinit", "upower-dinit", "power-profiles-daemon-dinit", "accountsservice-dinit", "fprintd-dinit", "bolt-dinit", "turnstile", "dbus-session-materializer-user-dinit", "dconf-user-dinit", "at-spi2-core-user-dinit", "xdg-desktop-portal-user-dinit", "kded-user-dinit", "kwallet-user-dinit", "kio-user-dinit", "kactivitymanagerd-user-dinit", "kio-fuse-user-dinit", "knighttime-user-dinit", "libkscreen-user-dinit", "kscreen-user-dinit", "ksystemstats-user-dinit", "plasma-workspace-user-dinit", "kio-extras-user-dinit", "kio5-user-dinit", "kglobalaccel-user-dinit", "dolphin-user-dinit", "xdg-desktop-portal-kde-user-dinit", "signon-ui-user-dinit", "signond-user-dinit", "xdg-desktop-portal-gtk-user-dinit", "glib-networking-user-dinit", "gnome-online-accounts-user-dinit", "evolution-data-server-user-dinit", "obexd-user-dinit", "ibus-user-dinit", "system-config-printer-user-dinit"]
    services: {"sddm": "default", "dbus": "default", "turnstiled": "default", "ursined": "default"}
    groups: ["video", "input"]
  niri:
    packages: ["niri", "niri-portalsconf", "greetd", "greetd-regreet", "elogind", "dbus", "ursine", "alacritty", "xdg-desktop-portal-wlr", "xdg-desktop-portal-gtk", "polkit-elogind", "polkit-gnome", "xwayland-satellite", "xwayland", "mesa-dri-gallium", "wayland-libs-server", "dms-shell", "dms-window-buttons", "matugen", "turnstile", "niri-user-dinit", "accountsservice", "power-profiles-daemon", "cups-pk-helper", "iptables", "ip6tables", "ebtables", "dbus-user-dinit", "pipewire-user-dinit", "pipewire-pulse-user-dinit", "wireplumber-user-dinit", "wayland-wait-user-dinit", "xdg-desktop-portal-user-dinit", "seahorse", "gnome-keyring-user-dinit", "polkit-agent-user-dinit", "wayvnc", "wayvnc-user-dinit", "networkmanager", "networkmanager-cli", "networkmanager-tui", "networkmanager-wifi", "wireless-regdb", "bluez", "wpa_supplicant", "wireguard-tools", "qt6-qtmultimedia", "i2c-tools", "wtype", "simple-scan", "sane", "sane-backends", "sane-utils", "sane-airscan", "gnome-keyring", "cosmic-edit", "eog", "cups", "cups-filters", "avahi", "cosmic-player", "libreoffice", "galculator", "firefox", "firewalld-gui", "gnome-firmware", "gnome-disk-utility", "kcron", "ksystemlog", "kimageformats", "khal", "adw-gtk3", "dconf", "font-terminus", "font-inconsolata", "font-dejavu", "font-noto", "font-noto-cjk", "font-awesome", "font-noto-extra", "gnome-maps", "gnome-calendar", "power-profiles-daemon-dinit", "accountsservice-dinit", "udisks2-dinit", "geoclue-dinit", "cups-pk-helper-dinit", "kcron-dinit", "gnome-online-accounts-user-dinit", "evolution-data-server-user-dinit", "gnome-apps-user-dinit", "flatpak-dinit", "flatpak-user-dinit", "at-spi2-core-user-dinit", "dconf-user-dinit", "kwallet-user-dinit", "kded-user-dinit", "signond-user-dinit", "localsearch-user-dinit", "xdg-desktop-portal-gtk-user-dinit", "xdg-desktop-portal-wlr-user-dinit", "xdg-desktop-portal-gnome-user-dinit", "upower-dinit", "wpa_supplicant-dinit", "kio-user-dinit", "nautilus-user-dinit", "glib-networking-user-dinit", "signon-ui-user-dinit"]
    flatpakPackages: ["io.github.zarestia_dev.rclone-manager", "com.github.tchx84.Flatseal"]
    # turnstile + niri-user-dinit: PAM session → user dinit (turnstiled);
    # Alpine niri-session's dinit branch starts the `niri` user service.
    # DUAL-INIT: turnstiled runs as a system service on BOTH inits (dinit:
    # boot.d link; OpenRC: rc-update — service ships in the turnstile-openrc
    # subpackage). The dinit USER backend is identical on both, so the
    # -user-dinit session stack below works under OpenRC too.
    # Login-shell trick: passwd shell = /usr/libexec/feralos/login-shell
    # (not in /etc/shells) skips niri-session's bash re-exec (see users.go)
    # cava (DMS audio visualizer) NOT on Alpine v3.24 — re-add when packaged
    # iptables/ip6tables/ebtables: firewalld direct-rule backends (runtime)
    # audio stack = user dinit services (pipewire-user-dinit + deps pull
    # pipewire/pipewire-pulse/wireplumber as runtime deps; session-supervised)
    # NetworkManager replaces ifupdown as the network service (DMS network/VPN
    # UI needs the NM backend; /etc/network/interfaces reduced to lo by the
    # desktop setup, NM manages eth0 — FIX-niri-dms.md rounds 30/44)
    # networkmanager-wifi: NM wifi PLUGIN subpackage (Alpine splits it) —
    # without it NM has NO wifi support and the DMS network widget shows no
    # wifi at all. wireless-regdb = regulatory table (real radios need it);
    # wpa_supplicant already in the list (NM spawns/supervises it itself).
    # bluez: DMS bluetooth widget speaks the org.bluez dbus API. The
    # -openrc/-dinit service packages are NOT listed: Alpine auto-pulls
    # bluez-openrc (install_if), the dinit conversion turns it into
    # bluez-dinit. Service name UNIFIED at "bluetooth" on BOTH inits
    # (feralos bluez-dinit r2 ships /lib/dinit.d/bluetooth — we own the
    # package, aports e9ac00c) → the single "bluetooth": "default" in the
    # services map below enables it for dinit AND OpenRC, niri-only
    # (desktop services map is merged into the per-desktop Runlevels, not
    # the base defaultRunlevels).
    # wayvnc = VNC server (round 37) — RustDesk flatpak REMOVED (round 43
    # cleanup philosophy: not part of the validated stack)
    services: {"greetd": "default", "elogind": "default", "firewalld": "default", "polkit": "default", "cupsd": "default", "networkmanager": "default", "bluetooth": "default", "ursined": "default"}
    # ADR-010 R1 amendment: explicitly-activated system units carry the OpenRC
    # initd name, so `services` alone drives both inits (dinitServices stays
    # empty). PPD (org.freedesktop.UPower.PowerProfiles) is dbus-activated on
    # demand — never boot-enabled; dbus decides when it runs.
    # render group does not exist on Alpine (video covers DRM access);
    # audio group: /dev/snd/* for pipewire (real-hardware audio);
    # plugdev: NM polkit rule allows GUI connection management (round 30);
    # lpadmin: CUPS SystemGroup (printer admin — cups-files.conf default)
    groups: ["video", "input", "audio", "plugdev", "netdev", "lpadmin"]
    # DMS 1.6.x + quickshell 0.3.x ship as NATIVE apk packages (feralos-aports)
    # — the nix stack (dms-shell/quickshell/dgop/nixGL/execfilter) is gone.
    # matugen (dynamic wallpaper theming backend) now ships from OUR repo
    # (feralos-aports 4.2.0 — absent in Alpine): dms-shell runs it for
    # wallpaper palettes; the generated DankMatugen KColorScheme export is
    # what the dms-theme-sync plugin propagates to GTK/Qt/KDE. rclone-ui
    # remains unpackaged (unrelated to the desktop stack).
    # RustDesk removed (round 43 cleanup + user decision): wayvnc is the
    # remote-desktop path (user dinit service, loopback by default).
  niriWayle:
    packages: ["niri", "niri-portalsconf", "greetd", "greetd-regreet", "elogind", "dbus", "ursine", "alacritty", "xdg-desktop-portal-wlr", "xdg-desktop-portal-gtk", "polkit-elogind", "polkit-gnome", "xwayland-satellite", "xwayland", "mesa-dri-gallium", "wayland-libs-server", "turnstile", "accountsservice", "power-profiles-daemon", "upower", "wl-clipboard-rs", "wayle", "wayle-session", "veila", "stasis", "raffi", "oo7", "oo7-pam", "oo7-cli", "oo7-portal", "matugen", "dbus-user-dinit", "pipewire-user-dinit", "pipewire-pulse-user-dinit", "wireplumber-user-dinit", "wayland-wait-user-dinit", "oo7-user-dinit", "xdg-desktop-portal-user-dinit", "polkit-agent-user-dinit", "wayvnc", "wayvnc-user-dinit", "networkmanager", "networkmanager-cli", "networkmanager-tui", "networkmanager-wifi", "wireless-regdb", "bluez", "wpa_supplicant", "wireguard-tools", "firewalld", "iptables", "ip6tables", "ebtables", "dconf", "xdg-user-dirs", "wtype", "i2c-tools", "adwaita-icon-theme", "hicolor-icon-theme", "font-terminus", "font-inconsolata", "font-dejavu", "font-noto", "font-noto-cjk", "font-awesome", "font-noto-extra", "power-profiles-daemon-dinit", "accountsservice-dinit", "udisks2-dinit", "geoclue-dinit", "cups-pk-helper-dinit", "kcron-dinit", "gnome-online-accounts-user-dinit", "evolution-data-server-user-dinit", "gnome-apps-user-dinit", "flatpak-dinit", "flatpak-user-dinit", "at-spi2-core-user-dinit", "dconf-user-dinit", "kwallet-user-dinit", "kded-user-dinit", "signond-user-dinit", "localsearch-user-dinit", "xdg-desktop-portal-gtk-user-dinit", "xdg-desktop-portal-wlr-user-dinit", "xdg-desktop-portal-gnome-user-dinit", "upower-dinit", "wpa_supplicant-dinit", "kio-user-dinit", "nautilus-user-dinit", "glib-networking-user-dinit", "signon-ui-user-dinit", "cosmic-edit", "cosmic-player", "eog", "libreoffice", "galculator", "firefox", "firewalld-gui", "gnome-firmware", "gnome-disk-utility", "kcron", "ksystemlog", "khal", "gnome-maps", "gnome-calendar", "simple-scan", "cups", "cups-filters", "cups-pk-helper", "avahi", "sane", "sane-backends", "sane-utils", "sane-airscan", "qt6-qtmultimedia", "kimageformats", "adw-gtk3"]
    # Key Rack (app.drey.KeyRack) = the niriWayle secrets GUI — Flathub
    # flatpak, NOT an apk: oo7-server and seahorse both ship
    # /usr/share/dbus-1/services/org.freedesktop.secrets.service, so the
    # seahorse apk CANNOT coexist with the oo7 stack (file conflict = the
    # apk world stays permanently broken). nixpkgs only has Key Rack 0.4.0
    # (too old). Flathub ships current 0.6.x (Rust + native oo7 client).
    flatpakPackages: ["app.drey.KeyRack", "io.github.zarestia_dev.rclone-manager", "com.github.tchx84.Flatseal"]
    # niriWayle: niri compositor + Wayle shell (bar/notifications/OSD/wallpaper)
    # + Veila lock screen + Raffi launcher + oo7 secrets (gnome-keyring replacement).
    # Shares the session infra with niri: turnstile + per-user dinit, pipewire
    # stack via *-user-dinit, portals, polkit agent, wayvnc.
    # wayle-session depends on niri-user-dinit (login-shell + niri user service)
    # + stasis, and ships the wayle-session script + wayle.user/veila.user
    # (veilad runs through the veilad-session env wrapper) + niriwayle.desktop.
    # stasis (context-aware idle manager; supervised stasis.user session service
    # started by the session script; FeralOS system config /etc/stasis/stasis.rune
    # = veila lock -> niri dpms -> loginctl suspend) is listed EXPLICITLY and
    # also pulled via the wayle-session dependency; veila remains the lock
    # screen (ext-session-lock; idle timing owned by stasis).
    # Apps = FULL parity with the niri app set (user request 2026-10-19):
    # browser/office/utilities + their support (printing, scanning, Qt/KDE
    # image+media plugins, adw-gtk3) + the niri flatpaks (rclone-manager,
    # Flatseal) alongside Key Rack. NOT copied: the DMS shell packages
    # (niri-only) and seahorse/gnome-keyring (oo7 + Key Rack own secrets;
    # seahorse conflicts on org.freedesktop.secrets.service).
    services: {"greetd": "default", "elogind": "default", "firewalld": "default", "polkit": "default", "cupsd": "default", "networkmanager": "default", "bluetooth": "default", "ursined": "default"}
    # ADR-010 R1 amendment: services alone drives both inits (see niri). PPD =
    # dbus-activated on demand.
    # upower has no dinit service: upowerd is dbus system-activated when Wayle
    # queries org.freedesktop.UPower (upower ships the dbus system-service file).
    # OpenRC side: upower-openrc is install_if-pulled like every -openrc pkg.
    groups: ["video", "input", "audio", "plugdev", "netdev", "lpadmin"]
  cosmic:
    packages: ["cosmic-session", "cosmic-term", "cosmic-greeter", "cosmic-edit", "cosmic-player", "cosmic-store", "cosmic-settings", "cosmic-screenshot", "cosmic-icons", "cosmic-initial-setup", "adwaita-icon-theme", "desktop-file-utils", "hicolor-icon-theme", "elogind", "dbus", "polkit", "ursine", "pipewire", "xdg-desktop-portal-cosmic", "upower-dinit", "geoclue-dinit", "turnstile", "dbus-session-materializer-user-dinit", "dconf-user-dinit", "at-spi2-core-user-dinit", "xdg-desktop-portal-user-dinit", "cosmic-applets-user-dinit", "xdg-desktop-portal-cosmic-user-dinit", "glib-networking-user-dinit", "playerctld-user-dinit"]
    services: {"cosmic-greeter": "default", "elogind": "default", "dbus": "default", "turnstiled": "default", "ursined": "default"}
    # Seat manager = elogind (same as niri/niriWayle/kde): turnstiled depends
    # on the elogind unit (OpenRC initd name per the ADR-010 R1 amendment), so
    # the user dinit + dbus-session-materializer stack works. cosmic-comp
    # reaches the seat through libseat's logind backend (libseat pkg,
    # transitive; Alpine 3.24 verified: NOTHING depends on the seatd daemon,
    # it is gone). NO "seat" group: the group came from the seatd package
    # (absent here); elogind manages device ACLs itself.
    # elogind-dinit NOT listed: -openrc/-dinit variants auto-pull/convert.
    groups: ["video", "input"]

# 3. Video Drivers Definitions
videoDrivers:
  amdgpu:
    # mesa-vulkan-ati = RADV ICD (Alpine renamed from mesa-vulkan-radeon);
    # vulkan-loader required separately (ICD does not pull it).
    # VDPAU (mesa-vdpau-gallium) removed upstream in mesa >=25 — VA-API only.
    packages: ["xf86-video-amdgpu", "mesa-dri-gallium", "mesa-va-gallium", "mesa-vulkan-ati", "vulkan-loader", "linux-firmware-amdgpu"]
    modules: ["amdgpu"]
  nvidia:
    packages: ["nvidia-lts", "nvidia-libs"]
    modules: ["nvidia", "nvidia-modeset"]
  intel:
    packages: ["mesa-dri-gallium", "mesa-va-gallium", "mesa-vulkan-intel", "intel-media-driver", "libva-intel-driver", "linux-firmware-i915"]
  virtio:
    # QEMU virtio-gpu userspace (virgl/venus pipe for virtio-gpu-gl)
    packages: ["mesa-dri-gallium", "mesa-vulkan-virtio"]
    modules: ["virtio_gpu"]

# Dummy packages: if key is installed, creates symlink for replaced package
# Symlink goes from /usr/bin/<replaced> → /usr/bin/<replacement>
# Bin overrides replacement binary name (e.g. ripgrep → rg)
# NOTE: grep NOT replaced — rg doesn't support GNU regex extensions (\+)
# NOTE: less NOT replaced here — a symlink less→bat crashes: bat execs its
# hardcoded pager `less -R -F -K --no-init` and cannot parse less flags
# (clap error). less ships as the aports package `less-dummy` instead
# (provides less=999, /usr/bin/less = wrapper script → bat --paging=never).
dummyPackages: {}

# Dynamic logic: if a package is in the install list, apply these changes
packageLogic:
  eudev:
    services: {"udev": "boot", "udev-trigger": "boot", "udev-settle": "boot", "udev-postmount": "default"}
  incus:
    groups: ["incus-admin"]
    services: {"incusd": "default"}
    modules: ["tun", "tap", "veth", "overlay"]
  incus-feature:
    packages: ["incus-feature-vm", "incus-feature-client", "incus-feature-utils", "bridge", "bridge-utils"]
    groups: ["incus-admin"]
    services: {"incusd": "default"}
    # 8021q was provided by the 'vlan' package rule — removed: the vlan package
    # conflicts with ifupdown-ng (required by networking-dinit); ifupdown-ng
    # handles vlan interfaces itself
    modules: ["tun", "tap", "bonding", "veth", "overlay", "8021q"]
  incus-feature-vm:
    packages: ["qemu-system-x86_64", "qemu-img", "qemu-modules"]
  qemu-system-x86_64:
    groups: ["kvm", "qemu"]
    modules: ["kvm"]
  podman:
    packages: ["podman", "iptables", "podman-compose", "podman-docker", "fuse-overlayfs"]
    services: {"podman": "default", "cgroups": "default"}
    modules: ["overlay"]
  zram-init:
    services: {"zram-init": "default"}
    modules: ["zram"]
  btrfs-progs:
    services: {"btrfs-scan": "boot"}
    modules: ["btrfs"]
  cryptsetup:
    services: {"dmcrypt": "boot"}
  sudo-rs:
    groups: ["wheel"]
  doas:
    groups: ["wheel"]
  sudo:
    groups: ["wheel"]
  vector:
    services: {"vector": "boot", "vector-setup": "boot"}
  cronie:
    services: {"cronie": "default"}
  chrony:
    services: {"chronyd": "default"}
  dbus:
    services: {"dbus": "default"}
  openssh:
    services: {"sshd": "default"}
  smartmontools:
    services: {"smartd": "default"}
  acpid:
    services: {"acpid": "default"}
  irqbalance:
    services: {"irqbalance": "default"}
  fwupd:
    # ADR-010 R1 amendment: fwupd is dbus-activated ON DEMAND (heavy daemon,
    # dbus decides when it runs) — never boot-enabled, no initd enablement on
    # either init. Activation routes through the shim to the bus-named unit
    # (supervised under dinit; OpenRC fallback = raw exec, documented).
  earlyoom:
    services: {"earlyoom": "default"}
  vlan:
    modules: ["8021q"]
  bridge:
    modules: ["bridge", "br_netfilter"]
  zstd:
    modules: ["zstd_compress"]
  docker:
    groups: ["docker"]
    services: {"docker": "default"}
    modules: ["overlay"]

# Packages to always provide as dummy (regardless of replacement)
# Used to satisfy dependencies without installing the real package
providePackages:
  - util-linux-misc

# Base modules always loaded via modules_force_load in booster
# These are kernel modules without specific packages (hardware drivers, kernel features)
# virtio* needed for QEMU target (virtio-net-pci, virtio-blk-pci)
baseModules:
  - r8169
  - binfmt_misc
  - sd_mod
  - sr_mod
  - ata_piix
  - ahci
  - nvme
  - virtio
  - virtio_pci
  - virtio_net
  - virtio_blk
  - virtio_scsi

