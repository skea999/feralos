run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - durationcheck
    - errorlint
    - copyloopvar
    - goconst
    - gocritic
    - gofmt
    - goimports
    - gosec
    - misspell
    - nilerr
    - prealloc
    - unconvert
    - unparam
    - whitespace
    - dupl

linters-settings:
  govet:
    enable:
      - shadow
  goconst:
    min-len: 3
    min-occurrences: 3
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
  gofmt:
    simplify: true
  dupl:
    threshold: 100

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - unparam
    - path: src/hostPhase/disks/
      linters:
        - dupl
    - path: src/chrootPhase/desktops/
      linters:
        - dupl
    - path: src/utils/firstboot/
      linters:
        - dupl
