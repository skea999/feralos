# full_stack.yaml: btrfsStandard server 2disk sb tpm hard zswap nix podman webmin dbg — full variables.yaml template mirror (machine-consumed)
variables:
  unattended: true
  ignoreErrors: true
  enableEdgeRepos: false
  disks:
  - /dev/sda
  - /dev/sdb
  userName: skea999
  password: Alpine.1
  luksPassword: Alpine.1
  hostname: skea-server
  timezone: Europe/Rome
  locale: it
  keymap: it
  mirror: https://dl-cdn.alpinelinux.org/alpine
