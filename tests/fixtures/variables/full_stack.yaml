  branch: latest-stable
  diskLayout: btrfsStandard
  desktopEnvironment: none
  videoDriver: ''
  sshAuthorizedKey: ''
  defaultNetworkInterface: eth0
  enableSecureboot: true
  enableTPM: true
  enableHardening: true
  enableZswap: true
  enableNix: true
  enableSwap: true
  swapSize: auto
  enableDebug: true
  enablePodman: true
  enableWebmin: true
  webminListenAll: false
  enableDinit: false
  extraPackages:
