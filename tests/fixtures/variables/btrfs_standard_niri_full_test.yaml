# btrfs_standard_niri_full_test.yaml: btrfsStandard niri 1disk sb tpm hard zswap podman dinit dbg edgeRepos — full variables.yaml template mirror (machine-consumed)
variables:
  unattended: true
  ignoreErrors: true
  enableEdgeRepos: true
  disks:
  - /dev/sda
  userName: skea999
  password: Alpine.1
  luksPassword: Alpine.1
  hostname: skea-server
  timezone: Europe/Rome
  locale: it
  keymap: it
  mirror: https://dl-cdn.alpinelinux.org/alpine
  arch: x86_64
  branch: latest-stable
  diskLayout: btrfsStandard
  desktopEnvironment: niri
  videoDriver: virtio
  sshAuthorizedKey: ''
  defaultNetworkInterface: eth0
  enableSecureboot: true
  enableTPM: true
  enableHardening: true
  enableZswap: true
  enableNix: false
  enableSwap: true
  swapSize: auto
  enableDebug: true
  enablePodman: true
  enableWebmin: false
  webminListenAll: false
  enableDinit: true
  extraPackages:
  - incus-feature
  - incus-feature-vm
  - incus-feature-client
  - incus-feature-utils
  - qemu-system-x86_64
  - qemu-img
  - qemu-modules
  extraPackagesEdge:
  - mesa@edge
  - mesa-dri-gallium@edge
  - mesa-gl@edge
  - mesa-egl@edge
  - mesa-gbm@edge
