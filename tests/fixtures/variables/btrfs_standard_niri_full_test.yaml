variables:
  unattended: true
  ignoreErrors: true
  enableEdgeRepos: true
  disks:
    - "/dev/sda"
  userName: "skea999"
  password: "Alpine.1"
  hostname: "skea-server"
  timezone: "Europe/Rome"
  locale: "it"
  keymap: "it"
  mirror: "https://dl-cdn.alpinelinux.org/alpine"
  arch: "x86_64"
  branch: "latest-stable"
  diskLayout: "btrfsStandard"
  desktopEnvironment: "niri"
  videoDriver: virtio
  sshAuthorizedKey: ""
  defaultNetworkInterface: "eth0"
  enableSecureboot: true
  enableTPM: true
  enableHardening: true
  enableZswap: true
  enableNix: false
  enableSwap: true
  swapSize: auto
  enableDebug: true
  enablePodman: true
  enableWebmin: false
  enableDinit: true
  extraPackages:
    - incus-feature
    - incus-feature-vm
    - incus-feature-client
    - incus-feature-utils
    - qemu-system-x86_64
    - qemu-img
    - qemu-modules
  # mesa from the @edge tagged repos (26.2.4 restores the virgl gallium
  # driver dropped in 3.24 26.1.6) — installed LAST via extraPackagesEdge
  extraPackagesEdge:
    - mesa@edge
    - mesa-dri-gallium@edge
    - mesa-gl@edge
    - mesa-egl@edge
    - mesa-gbm@edge
