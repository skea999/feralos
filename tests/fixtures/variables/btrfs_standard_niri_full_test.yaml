# btrfs_standard_niri_full_test.yaml: btrfsStandard niri 1disk sb tpm hard zswap podman dinit dbg edgeRepos — full variables.yaml template mirror (machine-consumed)
variables:
  unattended: true
  ignoreErrors: true
  enableEdgeRepos: true
  disks:
  - /dev/sda
  userName: skea999
  password: Alpine.1
  luksPassword: Alpine.1
  hostname: skea-server
  timezone: Europe/Rome
  locale: it
  keymap: it
  mirror: https://dl-cdn.alpinelinux.org/alpine
  arch: x86_64
  branch: latest-stable
  diskLayout: btrfsStandard
  desktopEnvironment: niri
  videoDriver: virtio
  sshAuthorizedKey: ''
  defaultNetworkInterface: eth0
  enableSecureboot: true
  enableTPM: true
  enableHardening: true
  enableZswap: true
  enableNix: true
  enableSwap: true
  swapSize: auto
  enableDebug: true
  enablePodman: true
  enableWebmin: true
  webminListenAll: false
  enableDinit: true
  flatpakPackages:
  - io.github.zarestia_dev.rclone-manager
  - com.github.tchx84.Flatseal
  extraPackages:
  - okular
  extraPackagesEdge:
  - mesa@edge
  - mesa-gl@edge
  - mesa-egl@edge
  - mesa-gles@edge
  - mesa-gbm@edge
  - mesa-dri-gallium@edge
  - mesa-vulkan-virtio@edge
