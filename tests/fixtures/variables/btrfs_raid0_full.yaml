# btrfs_raid0_full.yaml: btrfsRaid0 niri 2disk sb tpm hard zswap nix dbg edgeRepos — full variables.yaml template mirror (machine-consumed)
variables:
  unattended: true
  ignoreErrors: true
  enableEdgeRepos: true
  disks:
  - /dev/sda
  - /dev/sdb
  userName: skea999
  password: Alpine.1
  luksPassword: Alpine.1
  hostname: skea-server
  timezone: Europe/Rome
  locale: it
  keymap: it
  mirror: https://dl-cdn.alpinelinux.org/alpine
  arch: x86_64
  branch: latest-stable
  diskLayout: btrfsRaid0
  desktopEnvironment: niri
  videoDriver: virtio
  sshAuthorizedKey: ''
  defaultNetworkInterface: eth0
  enableSecureboot: true
  enableTPM: true
  enableHardening: true
  enableZswap: true
  enableNix: true
  enableSwap: true
  swapSize: auto
  enableDebug: true
  enablePodman: false
  enableWebmin: false
  webminListenAll: false
  enableDinit: false
  extraPackages:
  - okular
  extraPackagesEdge:
  - mesa@edge
  - mesa-gl@edge
  - mesa-egl@edge
  - mesa-gles@edge
  - mesa-gbm@edge
  - mesa-dri-gallium@edge
  - mesa-vulkan-virtio@edge
