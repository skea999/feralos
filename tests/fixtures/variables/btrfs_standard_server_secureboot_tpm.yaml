variables:
  unattended: true
  disks:
    - "/dev/sda"
    - "/dev/sdb"
  userName: "skea999"
  password: "Alpine.1"
  hostname: "skea-server"
  timezone: "Europe/Rome"
  locale: "it"
  keymap: "it"
  mirror: "https://dl-cdn.alpinelinux.org/alpine"
  arch: "x86_64"
  branch: "latest-stable"
  diskLayout: "btrfsStandardServer"
  desktopEnvironment: "none"
  videoDriver: "none"
  sshAuthorizedKey: ""
  defaultNetworkInterface: "eth0"
  enableSecureboot: true
  enableTPM: true
  enableHardening: false
  enableZswap: false
  enableNix: false
  enableSwap: true
  swapSize: auto
  enableDebug: false
  extraPackages:
    - incus-feature
    - incus-feature-vm
    - incus-feature-client
    - incus-feature-utils
    - qemu-system-x86_64
    - qemu-img
    - qemu-modules
