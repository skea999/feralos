variables:
  unattended: true
  ignoreErrors: true
  disks:
    - "/dev/sda"
  userName: "skea999"
  password: "Alpine.1"
  hostname: "skea-server"
  timezone: "Europe/Rome"
  locale: "it"
  keymap: "it"
  mirror: "https://dl-cdn.alpinelinux.org/alpine"
  arch: "x86_64"
  branch: "latest-stable"
  diskLayout: "btrfsStandard"
  desktopEnvironment: "kde"
  videoDriver: "amdgpu"
  sshAuthorizedKey: ""
  defaultNetworkInterface: "eth0"
  enableSecureboot: true
  enableTPM: true
  enableHardening: true
  enableDinit: true
  enableZswap: true
  enableNix: false
  enableSwap: true
  swapSize: auto
  enableDebug: true
  enablePodman: false
  enableWebmin: false
  extraPackages:
    - incus-feature
    - incus-feature-vm
    - incus-feature-client
    - incus-feature-utils
    - qemu-system-x86_64
    - qemu-img
    - qemu-modules
