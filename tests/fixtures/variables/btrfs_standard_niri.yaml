# btrfs_standard_niri.yaml: btrfsStandard niri 1disk dbg edgeRepos — full variables.yaml template mirror (machine-consumed)
variables:
  unattended: true
  ignoreErrors: true
  enableEdgeRepos: true
  disks:
  - /dev/sda
  userName: skea999
  password: Alpine.1
  luksPassword: Alpine.1
  hostname: skea-server
  timezone: Europe/Rome
  locale: it
  keymap: it
  mirror: https://dl-cdn.alpinelinux.org/alpine
  arch: x86_64
  branch: latest-stable
  diskLayout: btrfsStandard
  desktopEnvironment: niri
  videoDriver: virtio
  sshAuthorizedKey: ''
  defaultNetworkInterface: eth0
  enableSecureboot: false
  enableTPM: false
  enableHardening: false
  enableZswap: false
  enableNix: false
  enableSwap: true
  swapSize: auto
  enableDebug: true
  enablePodman: false
  enableWebmin: false
  webminListenAll: false
  enableDinit: false
  extraPackages:
  - incus-feature
  - incus-feature-vm
  - incus-feature-client
  - incus-feature-utils
  - qemu-system-x86_64
  - qemu-img
  - qemu-modules
  extraPackagesEdge:
  - mesa@edge
  - mesa-dri-gallium@edge
  - mesa-gl@edge
  - mesa-egl@edge
  - mesa-gbm@edge
