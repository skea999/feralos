# DEPRECATED: use tests/fixtures/variables/btrfs_standard_server_minimal.yaml
variables:
  unattended: true
  # Disk Configuration
  disks:
    - "/dev/sda"
    - "/dev/sdb"

  # User and Security
  userName: "skea999"
  password: "Alpine.1"

  # System Identity
  hostname: "skea-server"
  timezone: "Europe/Rome"
  locale: "it"
  keymap: "it"

  # Repository and Architecture
  mirror: "https://dl-cdn.alpinelinux.org/alpine"
  arch: "x86_64"
  branch: "latest-stable"

  # Layout
  diskLayout: "btrfsStandardServer" # Options defined in internal_rules
  desktopEnvironment: "none"        # Options: none, kde
  videoDriver: "none"               # Options: none, amdgpu, nvidia, intel

  # SSH (optional)
  sshAuthorizedKey: ""

  # Network
  defaultNetworkInterface: "eth0"

  # Feature Toggles
  enableSecureboot: false
  enableTPM: false
  enableHardening: false
  enableZswap: false
  enableNix: false
  enableSwap: true
  swapSize: auto
  enableDebug: false

  # Extra Packages
  # Adding these will trigger dynamic rules (groups, services, etc.)
  extraPackages:
    - incus-feature
    - incus-feature-vm
    - incus-feature-client
    - incus-feature-utils
    - qemu-system-x86_64
    - qemu-img
    - qemu-modules
